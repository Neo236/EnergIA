spring.application.name=analisis-energetico-api
server.port=${PORT:8080}

# -------------------------------------------------------------
# Spring Boot Actuator Configuration (Health & Readiness Probes)
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true

# probes.enabled crea los grupos liveness y readiness, pero readiness queda
# con un solo miembro: readinessState, que es el estado de disponibilidad del
# propio proceso (ApplicationAvailability) y NO mira la base de datos. Sin la
# linea de abajo, si PostgreSQL se cae DESPUES del arranque (reinicio del
# contenedor db, particion de red, pool agotado), /actuator/health pasa a DOWN
# pero /actuator/health/readiness sigue devolviendo UP: un falso verde que el
# CD y el checklist post-rollback interpretarian como "sano".
# Incluir db suma el DataSourceHealthIndicator (valida la conexion y el pool
# HikariCP), que es lo que docs/certificacion/README.md declara que valida.
#
# motorPersistencia (com.energia.health.VerificadorMotorPersistencia) cubre lo
# que db por si solo no ve: db responde UP con CUALQUIER DataSource que
# conteste, incluida una H2 en memoria. Produccion corrio nueve dias asi -
# contenedor previo a que existiera Postgres en el compose, jamas recreado - con
# todas las sondas en verde y sin persistencia real. Con el motor en el grupo,
# ese ambiente falla el gate del CD y dispara el rollback.
management.endpoint.health.group.readiness.include=readinessState,db,motorPersistencia

# Evita repetir el chequeo completo de salud (incluida la conexion a DB que
# abren tanto db como motorPersistencia) en cada llamada dentro de una
# ventana corta: el HEALTHCHECK de Docker cada 30s y el polling de
# "Verificar salud" del CD (hasta 12-15 intentos seguidos, cada pocos
# segundos) ya no pagan una conexion nueva por cada intento.
management.endpoint.health.cache.time-to-live=2s

#Configuracion Servicio de Machine Learning
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout=${ML_CONNECT_TIMEOUT:3000}
ml.service.read-timeout=${ML_REAL_TIMEOUT:5000}

# Token compartido para distinguir las verificaciones manuales (cabecera
# X-EnergIA-Sonda, ver com.energia.security.VerificadorSonda) de un
# analisis real, y no persistirlas. Vacio por defecto: sin este valor
# configurado, ninguna peticion se trata como sonda.
sonda.token=${TOKEN_SONDA_SALUD:}

# -------------------------------------------------------------
# Base de datos (persistencia de analisis) y Flyway
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/energia}
spring.datasource.username=${DB_USER:energia}
spring.datasource.password=${DB_PASSWORD:energia}

# El esquema lo maneja Flyway (db/migration), Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Open Session In View queda desactivado a proposito: mantiene la conexion a
# la DB abierta durante toda la request (incluida la serializacion de la
# respuesta) en vez de solo durante la transaccion, lo que agota el pool de
# conexiones antes bajo carga y esconde accesos a datos "lazy" fuera de una
# transaccion real. AnalisisEnergeticoService ya usa @Transactional donde
# hace falta, asi que desactivarlo no rompe nada.
spring.jpa.open-in-view=false
