services:
  # -------------------------------------------------------------
  # Base de datos - PostgreSQL (persistencia de analisis)
  #
  # DB local pensada para portar a Oracle mas adelante: motor
  # cliente-servidor real (no embebido), con volumen para que el
  # historial sobreviva a un restart del contenedor.
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    # Sin `ports`: la base solo la consume el backend, por la red interna de
    # Compose. Publicarla en el host no aportaba nada y chocaba con los otros
    # Postgres que ya corren en el servidor. Para inspeccionarla:
    #   docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-energia}
      - POSTGRES_USER=${POSTGRES_USER:-energia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-energia}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energia} -d ${POSTGRES_DB:-energia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - energia-network

  # -------------------------------------------------------------
  # Backend Principal - Spring Boot (Java 17)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: energia-backend:${BACKEND_TAG:-latest}
    # Sin `ports`: el unico servicio publicado en el host es `proxy`, que
    # sirve el frontend y la API bajo el mismo origen. El backend se alcanza
    # como http://backend:8080 dentro de la red de Compose.
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - ML_SERVICE_URL=http://ml-service:8000
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-energia}
      - DB_USER=${POSTGRES_USER:-energia}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-energia}
      - OCI_NAMESPACE=${OCI_NAMESPACE:-}
      - OCI_BUCKET=${OCI_BUCKET:-g9-energy-test-bucket}
      - OCI_REGION=${OCI_REGION:-sa-santiago-1}
      # Token de la sonda de verificacion de salud (ver
      # com.energia.security.VerificadorSonda). Vacio por defecto: en local
      # no hay nada que lo mande, asi que la deteccion de sonda queda inerte.
      - TOKEN_SONDA_SALUD=${TOKEN_SONDA_SALUD:-}
    depends_on:
      ml-service:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - energia-network

  # -------------------------------------------------------------
  # Microservicio Data Science / ML - FastAPI (Python 3.10)
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./data-science
      dockerfile: Dockerfile
    image: energia-ml-service:${ML_TAG:-latest}
    # Sin `ports`: solo lo consume el backend, por la red interna de Compose.
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      # El "bucket" de LocalStorage es /app/data, que en la imagen contiene
      # latest/ con el modelo entrenado versionado en el repo. Asi el
      # servicio encuentra latest/modelo_eficiencia_v1.joblib al arrancar y
      # NO cae al reentrenamiento de respaldo, que tarda y produce un modelo
      # equivalente pero no identico al que se sirvio en produccion.
      - STORAGE_LOCAL_ROOT=/app/data
      # PAR (Pre-Authenticated Request): usado cuando STORAGE_BACKEND=par.
      # No requiere SDK ni credenciales OCI. La URL lleva el token embebido.
      - OCI_PAR_URL=${OCI_PAR_URL:-}
      # SDK OCI: solo necesario cuando STORAGE_BACKEND=oci.
      - OCI_NAMESPACE=${OCI_NAMESPACE:-}
      - OCI_BUCKET=${OCI_BUCKET:-g9-energy-test-bucket}
      - OCI_REGION=${OCI_REGION:-sa-santiago-1}
      - OCI_INSTANCE_PRINCIPAL=${OCI_INSTANCE_PRINCIPAL:-false}
    restart: unless-stopped
    networks:
      - energia-network

  # -------------------------------------------------------------
  # Front-End (nginx)
  #
  # Sin `container_name` a proposito: Docker exige nombres unicos por host
  # y este servidor corre muchos proyectos. Compose ya nombra los
  # contenedores como <proyecto>-<servicio>-N, que es unico por stack.
  #
  # Sin `ports`: lo publica el proxy, que lo sirve bajo el mismo origen
  # que la API.
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: energia-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    networks:
      - energia-network

  # -------------------------------------------------------------
  # Proxy inverso - UNICA ENTRADA DEL STACK
  #
  # Fusiona frontend y API bajo un mismo origen: la raiz sirve la app y
  # /api/* (mas Swagger y Actuator) van al backend. Eso elimina el CORS
  # — sin el, la app y la API serian origenes distintos para el navegador,
  # porque el puerto forma parte del origen.
  #
  # NO termina TLS ni se expone a internet: delante esta el proxy de borde,
  # que hace HTTPS, WAF y rate limit. Por eso publica en 127.0.0.1 y llega
  # por el tunel, nunca por la interfaz publica.
  #
  # Antes vivia bajo el perfil `local` (solo desarrollo) porque en la VM
  # anterior habia un Caddy nativo haciendo este mismo ruteo. Al mover el
  # despliegue detras del borde ese Caddy desaparecio, y este servicio pasa
  # a cubrir su rol: es la misma pieza, ahora en produccion.
  # -------------------------------------------------------------
  proxy:
    image: caddy:2.11-alpine
    # La direccion de bind es una variable, no una constante, porque el
    # valor correcto depende de donde corre:
    #
    #   local  -> 127.0.0.1 (default): nada sale de la maquina.
    #   server -> la IP del tunel hacia el proxy de borde.
    #
    # En el servidor NO se usa 0.0.0.0. Docker publica sus puertos con
    # reglas propias de iptables en la cadena FORWARD, que las reglas de
    # UFW sobre INPUT no cubren: un bind a 0.0.0.0 quedaria alcanzable
    # desde toda la LAN aunque `ufw status` afirme lo contrario. Atarlo a
    # la IP del tunel hace que solo exista en esa interfaz, sin depender
    # de si el firewall del host filtra o no el trafico de Docker.
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8088}:8088"
    volumes:
      - ./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - energia-network

networks:
  energia-network:
    driver: bridge

volumes:
  db-data:
