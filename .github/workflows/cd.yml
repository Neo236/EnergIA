name: Despliegue

# Se dispara solo al mergear a main, y solo si cambió algo que se despliega.
# Un cambio de documentación no reinicia el servicio.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'data-science/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd.yml'
  # Permite redesplegar sin commitear — por ejemplo tras editar el .env del
  # servidor, que no está en el repositorio y por lo tanto nunca dispara nada.
  workflow_dispatch:

# Solo se necesita para clonar. El runner no toca la API de GitHub.
permissions:
  contents: read

# Un despliegue a la vez, y sin cancelar el que esté en curso: interrumpir a
# mitad de `docker compose up` deja el stack en un estado que nadie eligió.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en producción
    # La etiqueta `energia` es exclusiva de este proyecto: el runner está
    # registrado solo en este repositorio y no atiende a ningún otro.
    runs-on: [self-hosted, energia]
    timeout-minutes: 20

    steps:
      # El runner corre en el mismo servidor que el despliegue, pero en su
      # propio directorio de trabajo. Lo que se despliega es el clon de
      # ~/projects/EnergIA, no la copia que el runner acaba de bajar:
      # ese clon es el que tiene el .env con los secretos, que no está —ni debe
      # estar— en el repositorio.
      - name: Traer los cambios
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          git fetch --quiet origin main
          echo "Antes:   $(git rev-parse --short HEAD)"
          git reset --hard --quiet origin/main
          echo "Después: $(git rev-parse --short HEAD) $(git log -1 --format=%s | cut -c1-60)"

      # Antes de tocar nada. Si el despliegue sale mal, esto es lo que permite
      # volver: el rollback del código es un `git reset`, pero el de los datos
      # solo existe si alguien lo hizo antes.
      - name: Respaldar la base
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          ./infra/respaldo.sh

      - name: Construir y levantar
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          docker compose up -d --build

      # La verificacion corre DENTRO de la red de Compose, no desde el host.
      #
      # El puerto se publica en una interfaz concreta —la que indique
      # PROXY_BIND— y el firewall del servidor solo admite el origen que
      # corresponda. Una peticion nacida en este mismo servidor no es ese
      # origen: el `curl` se descarta y parece que el servicio esta caido
      # cuando esta perfecto. La primera corrida de este flujo fallo asi.
      #
      # Desde adentro de la red esa pregunta no existe: se le habla al servicio
      # `proxy` por su nombre, que es como se hablan entre si los contenedores.
      # El nombre de la red es estable porque el proyecto lo fija en el compose.
      - name: Esperar a que responda
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          for i in $(seq 1 30); do
            if docker run --rm --network energia_energia-network curlimages/curl:latest \
                 -fsS --max-time 5 http://proxy:8088/actuator/health > /dev/null 2>&1; then
              echo "Responde tras ~$((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "El stack no respondio en 5 minutos."
          exit 1

      # Mismas comprobaciones que el CI hace sobre el stack efimero, ahora
      # contra el que quedo sirviendo. Que las imagenes funcionaran en un
      # runner limpio no garantiza que este servidor este sirviendolas: puede
      # haber quedado un contenedor viejo en pie, o un .env desactualizado.
      - name: Verificar lo desplegado
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          en_red() { docker run --rm --network energia_energia-network curlimages/curl:latest "$@"; }

          docker compose logs ml-service | grep -q "Modelo pre-cargado en memoria" \
            || { echo "El servicio de ML no cargo el modelo del repositorio."; exit 1; }
          echo "  modelo: cargado de data/latest/"

          tipo=$(en_red -fsS -o /dev/null -w '%{content_type}' http://proxy:8088/fonts/inter-latin.woff2)
          case "$tipo" in
            font/woff2*) echo "  estaticos: $tipo" ;;
            *) echo "  fuente servida como '$tipo': public/ no llego a la imagen."; exit 1 ;;
          esac

          # El analisis de verificacion NO se persiste: la cabecera lo marca
          # como sonda. Sin eso, cada despliegue dejaria una fila de basura.
          token="$(grep -E '^TOKEN_SONDA_SALUD=' .env | cut -d= -f2- || true)"
          respuesta=$(en_red -fsS --max-time 30 -X POST http://proxy:8088/api/v1/analisis-energetico \
            -H 'Content-Type: application/json' \
            ${token:+-H "X-EnergIA-Sonda: $token"} \
            -d '{"consumo_kwh":420,"cantidad_equipos":10,"tipo_inmueble":"Casa",
                 "uso_horario_pico":false,"horas_alto_consumo":12,"zona_fria":false,
                 "calidad_aislamiento":"Media","fuente_calefaccion":"Electricidad",
                 "fuente_agua_caliente":"Electricidad"}')
          case "$respuesta" in
            *'"categoria":"Moderado"'*) echo "  analisis de referencia: correcto" ;;
            *) echo "  analisis inesperado: $respuesta"; exit 1 ;;
          esac

      # Vuelve al commit anterior y relevanta. Cubre el caso en que el stack
      # construye pero no sirve — que es justo el que un `docker compose up`
      # exitoso no distingue.
      - name: Revertir si falló
        if: failure()
        run: |
          set -euo pipefail
          cd ~/projects/EnergIA
          echo "El despliegue falló. Volviendo al commit anterior."
          git reset --hard --quiet HEAD~1
          echo "Ahora en: $(git rev-parse --short HEAD)"
          docker compose up -d --build
          echo "Revertido. Revisar los logs antes de volver a intentar."

      - name: Logs si algo falló
        if: failure()
        run: |
          cd ~/projects/EnergIA
          docker compose logs --tail=80

      - name: Estado final
        if: always()
        run: |
          cd ~/projects/EnergIA
          docker compose ps
