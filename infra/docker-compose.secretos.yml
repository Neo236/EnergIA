# Los secretos de produccion, como archivos y no como variables.
#
#   docker compose -f docker-compose.yml -f infra/docker-compose.secretos.yml up -d
#
# En el servidor no hay ningun secreto en disco: el administrador de la flota
# los deja en memoria, en /run/secretos/energia/ (un archivo por secreto, que
# se borra al reiniciar), y los vuelve a mandar despues de cada arranque. Ver
# docs/DESPLIEGUE.md.
#
# Por que archivos: una variable de `environment:` la muestra `docker inspect`
# a cualquiera que hable con Docker. Un `secrets:` se monta como archivo en
# /run/secrets/<nombre> y no aparece en la configuracion del contenedor.
#
# En desarrollo no se usa: el compose de siempre trae valores por defecto.

services:
  db:
    environment:
      # Sin valor: Compose la saca del contenedor. La imagen de postgres no
      # acepta las dos (POSTGRES_PASSWORD y POSTGRES_PASSWORD_FILE) a la vez.
      # Solo la usa al crear la base; con el volumen ya inicializado, no.
      - POSTGRES_PASSWORD
      - POSTGRES_PASSWORD_FILE=/run/secrets/DB_PASSWORD
    secrets:
      - source: postgres_password
        target: DB_PASSWORD

  backend:
    environment:
      # Sin valor: Compose las saca del contenedor, y Spring las lee de
      # /run/secrets (spring.config.import=configtree, application.properties)
      # con el mismo nombre. Una variable, aunque sea vacia, le ganaria al
      # archivo.
      - DB_PASSWORD
      - TOKEN_SONDA_SALUD
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
      - source: token_sonda_salud
        target: TOKEN_SONDA_SALUD

secrets:
  postgres_password:
    file: ${SECRETOS_ENERGIA:-/run/secretos/energia}/POSTGRES_PASSWORD
  token_sonda_salud:
    file: ${SECRETOS_ENERGIA:-/run/secretos/energia}/TOKEN_SONDA_SALUD
