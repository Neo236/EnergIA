# Front-End EnergiAI — solo sirve estáticos.
#
# Este contenedor NO habla con el backend ni proxea /api. El ruteo
# same-origin lo hace el proxy de arriba (Caddy nativo en la VM,
# el servicio `proxy` del compose en local). Mantenerlo así deja al
# front desacoplado: no necesita saber dónde vive la API, y se puede
# construir y desplegar sin que el backend exista.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cuando el front pase a SPA con router, esta línea pasa a ser
    # `try_files $uri $uri/ /index.html;` para que las rutas del cliente
    # no devuelvan 404 al recargar.
    location / {
        try_files $uri $uri/ =404;
    }

    # El HTML se revalida siempre; el resto puede cachearse, pero sin
    # hashes en los nombres de archivo todavía no conviene ser agresivo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
