    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "consumo_kwh": 300,
          "cantidad_equipos": 8,
          "tipo_inmueble": "Casa",
          "uso_horario_pico": true,
          "horas_alto_consumo": 6,
          "metros_cuadrados": 30,
          "antiguedad_vivienda": 34,
          "zona_fria": false,
          "calidad_aislamiento": "MEDIA",
          "fuente_calefaccion": "SOLAR",
          "fuente_agua_caliente": "ELECTRICIDAD"
        }
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      afterResponse: >-
        insomnia.test("Status code es 200 OK", () => {
            insomnia.expect(insomnia.response.code).to.equal(200);
        });


        insomnia.test("Validar estructura de respuesta y rangos", () => {
            const body = JSON.parse(insomnia.response.body);

            // Validar propiedades obligatorias
            insomnia.expect(body).to.have.property("id");
            insomnia.expect(body).to.have.property("fecha");
            insomnia.expect(body).to.have.property("categoria");
            insomnia.expect(body).to.have.property("probabilidad");
            insomnia.expect(body).to.have.property("costo_estimado_mensual");
            insomnia.expect(body).to.have.property("recomendaciones");

            // Validar tipos de datos y rangos
            insomnia.expect(body.probabilidad).to.be.within(0.0, 1.0);
            insomnia.expect(body.costo_estimado_mensual).to.be.above(0);
            insomnia.expect(body.recomendaciones).to.be.an("array").that.is.not.empty;
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
