name: CD Data Science / ML (FastAPI)

on:
  push:
    branches: [main, develop]
    paths:
      - 'data-science/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd-ml.yml'
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino'
        required: true
        type: choice
        options: [staging, produccion]
        default: staging
      tag:
        description: 'SHA a desplegar (vacío = HEAD de la rama). Usar para rollback.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-ml-${{ github.event.inputs.ambiente || (github.ref_name == 'main' && 'produccion' || 'staging') }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar ML Service (FastAPI)
    runs-on: [self-hosted, oci]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Resolver ambiente
        id: env
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.ambiente }}" ]; then
            AMBIENTE="${{ github.event.inputs.ambiente }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            AMBIENTE="produccion"
          else
            AMBIENTE="staging"
          fi

          if [ "$AMBIENTE" = "produccion" ]; then
            echo "proyecto=energiai-prod" >> "$GITHUB_OUTPUT"
            echo "puerto=8000"            >> "$GITHUB_OUTPUT"
          else
            echo "proyecto=energiai-staging" >> "$GITHUB_OUTPUT"
            echo "puerto=8002"               >> "$GITHUB_OUTPUT"
          fi
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

          echo "Ambiente: $AMBIENTE"

      - name: Registrar versión actualmente en ejecución
        id: previa
        run: |
          set -euo pipefail
          CID=$(docker compose -p "${{ steps.env.outputs.proyecto }}" ps -q ml-service 2>/dev/null || true)
          if [ -n "$CID" ]; then
            IMAGEN=$(docker inspect --format '{{.Config.Image}}' "$CID")
            TAG_PREVIO="${IMAGEN#energiai-ml-service:}"
            echo "Versión en ejecución: $TAG_PREVIO"
          else
            TAG_PREVIO=""
            echo "No hay ml-service corriendo en este ambiente (primer deploy)."
          fi
          echo "tag=$TAG_PREVIO" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: |
          set -euo pipefail
          TAG="energiai-ml-service:${{ steps.env.outputs.tag }}"
          if docker image inspect "$TAG" > /dev/null 2>&1; then
            echo "La imagen $TAG ya existe — se reutiliza (rollback)."
          else
            docker build -t "$TAG" -f data-science/Dockerfile ./data-science
          fi
          # Verificar que la imagen quedó correctamente taggeada antes de continuar
          docker image inspect "$TAG" > /dev/null 2>&1 || {
            echo "::error::La imagen $TAG no fue encontrada tras el build."
            exit 1
          }

      - name: Verificar archivo .env en VM
        id: dotenv
        run: |
          set -euo pipefail
          # Los .env viven en ~/energiai-envs/ con nombre por ambiente
          if [ "${{ steps.env.outputs.ambiente }}" = "produccion" ]; then
            ENV_FILE="$HOME/energiai-envs/.env.prod"
          else
            ENV_FILE="$HOME/energiai-envs/.env.staging"
          fi
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"

          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Archivo de entorno no encontrado: $ENV_FILE"
            exit 1
          fi
          BACKEND=$(grep -E '^STORAGE_BACKEND=' "$ENV_FILE" | cut -d= -f2 || echo 'local')
          echo "STORAGE_BACKEND detectado: $BACKEND"
          if [ "$BACKEND" = "par" ]; then
            PAR_URL=$(grep -E '^OCI_PAR_URL=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$PAR_URL" ]; then
              echo "::error::STORAGE_BACKEND=par pero OCI_PAR_URL no está definida en $ENV_FILE"
              exit 1
            fi
            echo "OCI_PAR_URL=*** (presente)"
          elif [ "$BACKEND" = "oci" ]; then
            NS=$(grep -E '^OCI_NAMESPACE=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$NS" ]; then
              echo "::error::STORAGE_BACKEND=oci pero OCI_NAMESPACE no está definida en $ENV_FILE"
              exit 1
            fi
            echo "OCI_NAMESPACE=*** (presente)"
          else
            echo "STORAGE_BACKEND=local: no se requieren credenciales OCI."
          fi

      - name: Levantar
        env:
          ML_TAG: ${{ steps.env.outputs.tag }}
          ML_PORT: ${{ steps.env.outputs.puerto }}
        run: |
          set -euo pipefail
          # export explícito: blindar contra cualquier ML_TAG residual del runner
          export ML_TAG="$ML_TAG"
          export ML_PORT="$ML_PORT"
          echo "Levantando ml-service con imagen energiai-ml-service:${ML_TAG}"
          docker compose --env-file "${{ steps.dotenv.outputs.env_file }}" \
            -p "${{ steps.env.outputs.proyecto }}" up -d --no-build --no-deps ml-service

      - name: Entrenar modelo
        # /health del servicio ML responde "healthy" pase lo que pase (ver
        # interfaces/api/app.py): no depende de que el modelo haya cargado, así
        # que "Verificar salud" no detecta un modelo faltante. El 503 real
        # aparece recién en el POST de inferencia, cuando ensure_artifacts()
        # no pudo traer el modelo del bucket. Entrenarlo acá, en el contenedor
        # recién levantado, deja artefactos locales que no dependen de que
        # OCI/PAR esté configurado ni disponible.
        #
        # --dry-run es obligatorio: sin él, interfaces.cli.train también SUBE
        # los artefactos al bucket configurado en STORAGE_BACKEND (ver
        # interfaces/cli/train.py, _safe_upload_with_rotation). Staging y
        # producción comparten el mismo OCI_PAR_URL, así que un entrenamiento
        # "de respaldo" sin --dry-run reescribiría en cada deploy el modelo
        # oficial que ambos ambientes leen al arrancar — exactamente lo que
        # este paso NO debe hacer.
        run: |
          set -euo pipefail
          echo "Entrenando modelo de respaldo en el contenedor (sin publicar al bucket)..."
          docker compose -p "${{ steps.env.outputs.proyecto }}" \
            exec -T ml-service bash -c "cd /app && python3 -m interfaces.cli.train --dry-run"

      - name: Verificar salud
        id: salud
        continue-on-error: true
        run: |
          set -uo pipefail
          # 15 x 4 s = 60 s: margen para el startup de FastAPI que descarga
          # artefactos del modelo desde OCI/PAR en el primer deploy.
          for i in $(seq 1 15); do
            echo "Intento $i/15 - http://127.0.0.1:${{ steps.env.outputs.puerto }}/health"
            HTTP=$(curl -o /tmp/health_resp.txt -w "%{http_code}" -sS \
              "http://127.0.0.1:${{ steps.env.outputs.puerto }}/health" 2>/tmp/health_err.txt || true)
            BODY=$(cat /tmp/health_resp.txt 2>/dev/null || true)
            if echo "$BODY" | grep -q '"status":"healthy"'; then
              echo "ML Service respondiendo OK (intento $i). HTTP $HTTP"
              exit 0
            fi
            echo "  HTTP: $HTTP | Body: $BODY"
            cat /tmp/health_err.txt 2>/dev/null || true
            sleep 4
          done
          echo "El servicio ML no respondió después de 60 s."
          echo "--- Logs del contenedor ml-service ---"
          docker compose -p "${{ steps.env.outputs.proyecto }}" logs --tail=50 ml-service || true
          echo "--- Estado de contenedores ---"
          docker compose -p "${{ steps.env.outputs.proyecto }}" ps || true
          exit 1

      - name: Revertir si falló la verificación
        if: steps.salud.outcome == 'failure' && steps.previa.outputs.tag != ''
        env:
          ML_TAG: ${{ steps.previa.outputs.tag }}
          ML_PORT: ${{ steps.env.outputs.puerto }}
        run: |
          set -euo pipefail
          # Verificar que la imagen de rollback todavía existe (la limpieza conserva 5)
          if ! docker image inspect "energiai-ml-service:${{ steps.previa.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::Imagen de rollback energiai-ml-service:${{ steps.previa.outputs.tag }} no encontrada. Rollback automático imposible."
            exit 1
          fi
          export ML_TAG="$ML_TAG"
          export ML_PORT="$ML_PORT"
          echo "::warning::Deploy fallido. Restaurando la versión ${{ steps.previa.outputs.tag }}"
          docker compose --env-file "${{ steps.dotenv.outputs.env_file }}" -p "${{ steps.env.outputs.proyecto }}" up -d --no-build --no-deps ml-service
          echo "Ambiente restaurado."

      - name: Marcar el job como fallido si hubo rollback
        if: steps.salud.outcome == 'failure'
        run: |
          echo "::error::El despliegue no superó la verificación de salud."
          exit 1

      - name: Limpiar imágenes viejas
        if: always()
        run: |
          set -uo pipefail
          EN_USO=$(docker ps -a --format '{{.Image}}' | sort -u)
          docker images 'energiai-ml-service' --format '{{.Tag}} {{.CreatedAt}}' \
            | grep -v '^local ' \
            | sort -k2 -r \
            | tail -n +6 \
            | awk '{print $1}' \
            | while read -r TAG; do
                IMG="energiai-ml-service:$TAG"
                if echo "$EN_USO" | grep -qxF "$IMG"; then
                  echo "  conservada (en uso): $IMG"
                else
                  docker rmi "$IMG" >/dev/null 2>&1 && echo "  borrada: $IMG" || true
                fi
              done

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue de Data Science / ML (FastAPI)"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Ambiente | ${{ steps.env.outputs.ambiente }} |"
            echo "| Proyecto compose | ${{ steps.env.outputs.proyecto }} |"
            echo "| Puerto interno | ${{ steps.env.outputs.puerto }} |"
            echo "| Versión desplegada | \`${{ steps.env.outputs.tag }}\` |"
            echo "| Versión anterior | \`${{ steps.previa.outputs.tag || '—' }}\` |"
            echo ""
            echo "Para volver atrás: *Run workflow* con el SHA de la versión anterior."
          } >> "$GITHUB_STEP_SUMMARY"
