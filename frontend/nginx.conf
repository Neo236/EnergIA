# Front-End EnergIA — solo sirve estáticos.
#
# Este contenedor NO habla con el backend ni proxea /api. El ruteo
# same-origin lo hace el proxy de arriba (Caddy nativo en la VM, el
# servicio `proxy` del compose en local). Mantenerlo así deja al front
# desacoplado: no necesita saber dónde vive la API, y se puede construir
# y desplegar sin que el backend exista.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El router vive en el cliente: /resultado y /analisis/:id no son
    # archivos. Sin este fallback, recargar en esas rutas daría 404 de
    # nginx en lugar de dejar que React resuelva —incluido su propio 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML nunca se cachea: es el que referencia los bundles con hash.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite pone un hash en el nombre de cada archivo de assets/, así que
    # un cambio genera un nombre nuevo y se puede cachear sin miedo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Navegadores piden /favicon.ico por costumbre aunque <link rel="icon">
    # ya apunta a /favicon.svg. Sin este bloque caía en el fallback de
    # arriba y devolvía 200 con la app entera en vez de un 404 real — un
    # "soft 200" que ensucia los logs de acceso sin que nadie lo pidiera.
    # Location con `=` (coincidencia exacta) tiene prioridad sobre el
    # prefijo `/`, así que este bloque no interfiere con ninguna otra ruta.
    location = /favicon.ico {
        try_files $uri =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
