  - url: http://localhost:8080/api/v1/analisis-energetico
    name: Validar Estructura y Rangos
    meta:
      id: req_03a440c403f443c98ce384d8d24205d3
      created: 1787058306141
      modified: 1787058619765
      isPrivate: false
      description: ""
      sortKey: -1776237531837.75
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "consumo_kwh": 100,
          "cantidad_equipos": 2,
          "tipo_inmueble": "Casa",
          "uso_horario_pico": false,
          "horas_alto_consumo": 6,
          "metros_cuadrados": 30,
          "antiguedad_vivienda": 34,
          "zona_fria": false,
          "calidad_aislamiento": "MEDIA",
          "fuente_calefaccion": "SOLAR",
          "fuente_agua_caliente": "ELECTRICIDAD"
        }
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      afterResponse: >-
        const response = insomnia.response;

        const body = JSON.parse(response.body);


        // 1. Status code

        insomnia.test("Status Code Es 200 OK", () => {
            insomnia.expect(response.code).to.equal(200);
        });


        // 2. Estructura y tipos de datos

        insomnia.test("Validar Estructura De Campos Obligatorios", () => {
            // Busca las claves que existan en tu respuesta
            const keys = Object.keys(body);
            insomnia.expect(keys.length, "La respuesta no debe estar vacía").to.be.greaterThan(0);

            // Valida que exista al menos un texto descriptivo (perfil/categoría)
            const textoValido = Object.values(body).some(val => typeof val === "string" && val.length > 0);
            insomnia.expect(textoValido, "Debe incluir al menos un campo de texto con la clasificación/recomendación").to.be.true;

            // Valida que los campos numéricos devueltos sean de tipo number
            const numeros = Object.values(body).filter(val => typeof val === "number");
            insomnia.expect(numeros.length, "Debe contener al menos un valor numérico (id, índice o consumo)").to.be.greaterThan(0);
        });


        // 3. Rangos y validación de negocio

        insomnia.test("Validar Rangos Numéricos Y Categorías De Negocio", () =>
        {
            // Validar que ningún número sea negativo
            Object.values(body).forEach(val => {
                if (typeof val === "number") {
                    insomnia.expect(val).to.be.at.least(0);
                }
            });

            // Validar perfil en texto si está presente
            const perfil = body.perfil || body.perfilConsumo || body.perfil_consumo || body.categoria;
            if (perfil) {
                const perfilesValidos = [
                    "EFICIENTE", "MODERADO", "INEFICIENTE",
                    "Eficiente", "Moderado", "Ineficiente",
                    "ALTO CONSUMO", "Alto Consumo"
                ];
                insomnia.expect(perfilesValidos).to.include(perfil);
            }
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
