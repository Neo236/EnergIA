name: CD Backend (Spring Boot)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino'
        required: true
        type: choice
        options: [staging, produccion]
        default: staging
      tag:
        description: 'SHA a desplegar (vacío = HEAD de la rama). Usar para rollback.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-backend-${{ github.event.inputs.ambiente || (github.ref_name == 'main' && 'produccion' || 'staging') }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar Backend (Spring Boot)
    runs-on: [self-hosted, oci]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Resolver ambiente
        id: env
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.ambiente }}" ]; then
            AMBIENTE="${{ github.event.inputs.ambiente }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            AMBIENTE="produccion"
          else
            AMBIENTE="staging"
          fi

          # db_puerto: igual que `puerto` (backend), pero para el host donde
          # publica Postgres. staging y produccion corren en el mismo runner
          # self-hosted, y docker-compose.yml solo tiene un default (5432)
          # para DB_PORT — sin un valor distinto por ambiente acá, el segundo
          # proyecto de Compose que intenta levantar `db` en el host falla
          # porque el puerto ya esta tomado por el otro ambiente. Ninguno de
          # los dos coincide con el default de docker-compose.yml a proposito,
          # para no chocar con lo que ya este corriendo con ese default mientras
          # este cambio se despliega.
          if [ "$AMBIENTE" = "produccion" ]; then
            echo "proyecto=energiai-prod" >> "$GITHUB_OUTPUT"
            echo "puerto=8080"            >> "$GITHUB_OUTPUT"
            echo "db_puerto=5434"         >> "$GITHUB_OUTPUT"
          else
            echo "proyecto=energiai-staging" >> "$GITHUB_OUTPUT"
            echo "puerto=8081"               >> "$GITHUB_OUTPUT"
            echo "db_puerto=5433"            >> "$GITHUB_OUTPUT"
          fi
          echo "ambiente=$AMBIENTE" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

          echo "Ambiente: $AMBIENTE"

      - name: Registrar versión actualmente en ejecución
        id: previa
        run: |
          set -euo pipefail
          CID=$(docker compose -p "${{ steps.env.outputs.proyecto }}" ps -q backend 2>/dev/null || true)
          if [ -n "$CID" ]; then
            IMAGEN=$(docker inspect --format '{{.Config.Image}}' "$CID")
            TAG_PREVIO="${IMAGEN#energiai-backend:}"
            echo "Versión en ejecución: $TAG_PREVIO"
          else
            TAG_PREVIO=""
            echo "No hay backend corriendo en este ambiente (primer deploy)."
          fi
          echo "tag=$TAG_PREVIO" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: |
          set -euo pipefail
          TAG="energiai-backend:${{ steps.env.outputs.tag }}"
          if docker image inspect "$TAG" > /dev/null 2>&1; then
            echo "La imagen $TAG ya existe — se reutiliza (rollback)."
          else
            docker build -t "$TAG" ./backend
          fi
          # Verificar que la imagen quedó correctamente taggeada antes de continuar
          docker image inspect "$TAG" > /dev/null 2>&1 || {
            echo "::error::La imagen $TAG no fue encontrada tras el build."
            exit 1
          }

      - name: Verificar archivo .env en VM
        id: dotenv
        run: |
          set -euo pipefail
          # Los .env viven en ~/energiai-envs/ con nombre por ambiente
          if [ "${{ steps.env.outputs.ambiente }}" = "produccion" ]; then
            ENV_FILE="$HOME/energiai-envs/.env.prod"
          else
            ENV_FILE="$HOME/energiai-envs/.env.staging"
          fi
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"

          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Archivo de entorno no encontrado: $ENV_FILE"
            exit 1
          fi
          BACKEND=$(grep -E '^STORAGE_BACKEND=' "$ENV_FILE" | cut -d= -f2 || echo 'local')
          echo "STORAGE_BACKEND detectado: $BACKEND"
          if [ "$BACKEND" = "par" ]; then
            PAR_URL=$(grep -E '^OCI_PAR_URL=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$PAR_URL" ]; then
              echo "::error::STORAGE_BACKEND=par pero OCI_PAR_URL no está definida en $ENV_FILE"
              exit 1
            fi
            echo "OCI_PAR_URL=*** (presente)"
          elif [ "$BACKEND" = "oci" ]; then
            NS=$(grep -E '^OCI_NAMESPACE=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$NS" ]; then
              echo "::error::STORAGE_BACKEND=oci pero OCI_NAMESPACE no está definida en $ENV_FILE"
              exit 1
            fi
            echo "OCI_NAMESPACE=*** (presente)"
          else
            echo "STORAGE_BACKEND=local: no se requieren credenciales OCI."
          fi

          # Producción corre contra Postgres real (ver docker-compose.yml) y
          # verifica peticiones de sonda con un token compartido (ver
          # VerificadorSonda). Ambos caen a valores inseguros por defecto
          # (POSTGRES_PASSWORD=energiai, sonda deshabilitada) si no están en
          # el .env — sin este chequeo, un .env.prod que nunca se actualizó
          # tras sumar persistencia despliega en silencio con esas credenciales
          # de fábrica.
          if [ "${{ steps.env.outputs.ambiente }}" = "produccion" ]; then
            PG_PASSWORD=$(grep -E '^POSTGRES_PASSWORD=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$PG_PASSWORD" ]; then
              echo "::error::POSTGRES_PASSWORD no está definida (o vacía) en $ENV_FILE para producción."
              exit 1
            fi
            if [ "$PG_PASSWORD" = "energiai" ]; then
              echo "::error::POSTGRES_PASSWORD sigue en el valor por defecto de docker-compose.yml ('energiai'). Cambiala antes de desplegar a producción."
              exit 1
            fi

            SONDA_TOKEN=$(grep -E '^TOKEN_SONDA_SALUD=' "$ENV_FILE" | cut -d= -f2 || echo '')
            if [ -z "$SONDA_TOKEN" ]; then
              echo "::error::TOKEN_SONDA_SALUD no está definida (o vacía) en $ENV_FILE para producción."
              exit 1
            fi
          fi

      - name: Asegurar dependencias
        # El backend depende de `db` (ver docker-compose.yml), pero "Levantar" usa
        # --no-deps para no reiniciar servicios que no cambiaron — y --no-deps hace
        # que Compose NO levante `db` sola si todavía no existe en este ambiente.
        # Sin este paso, un ambiente que nunca tuvo Postgres arriba (por ejemplo el
        # primer deploy tras sumar persistencia) falla con "Connection refused" y
        # el backend hace rollback en bucle. `db` es restart:unless-stopped, así que
        # levantarla una vez acá alcanza para todo el resto del job, incluida la
        # verificación de salud y un eventual rollback más abajo.
        env:
          DB_PORT: ${{ steps.env.outputs.db_puerto }}
        run: |
          set -euo pipefail
          # export explícito, mismo motivo que BACKEND_PORT en "Levantar": una
          # variable de entorno del shell pisa lo que diga --env-file, así que
          # esto es lo que realmente fija el puerto por ambiente — sin esto,
          # staging y producción compiten por el mismo default de
          # docker-compose.yml (DB_PORT:-5432) al correr en el mismo runner.
          export DB_PORT="$DB_PORT"
          echo "Asegurando dependencias (db)..."
          # --wait bloquea hasta que el healthcheck de `db` (pg_isready) pase,
          # no solo hasta que el contenedor arranque: en el primer deploy de un
          # ambiente (volumen vacío), el initdb de Postgres puede tardar más
          # que un arranque en caliente, y sin esto el paso siguiente puede
          # levantar el backend (y correr la migración de Flyway) contra una
          # base que todavía no está lista para aceptar conexiones.
          docker compose --env-file "${{ steps.dotenv.outputs.env_file }}" \
            -p "${{ steps.env.outputs.proyecto }}" up -d db --wait --wait-timeout 60

      - name: Levantar
        env:
          BACKEND_TAG: ${{ steps.env.outputs.tag }}
          BACKEND_PORT: ${{ steps.env.outputs.puerto }}
        run: |
          set -euo pipefail
          # export explícito: blindar contra cualquier BACKEND_TAG residual del runner
          export BACKEND_TAG="$BACKEND_TAG"
          export BACKEND_PORT="$BACKEND_PORT"
          echo "Levantando backend con imagen energiai-backend:${BACKEND_TAG}"
          docker compose --env-file "${{ steps.dotenv.outputs.env_file }}" \
            -p "${{ steps.env.outputs.proyecto }}" up -d --no-build --no-deps backend

      - name: Verificar salud
        id: salud
        continue-on-error: true
        run: |
          set -uo pipefail
          # RUNNER_TEMP es un directorio por-job: en el runner self-hosted,
          # dos deploys (p.ej. backend y ml) pueden ejecutarse cerca uno del
          # otro y compartir filesystem. Una ruta fija en /tmp hacía que un
          # curl fallido de este job (sin body) dejara leer al siguiente el
          # archivo viejo de OTRO job — pasó de verdad entre cd-backend y
          # cd-ml en el mismo push.
          RESP="$RUNNER_TEMP/health_resp.txt"
          ERR="$RUNNER_TEMP/health_err.txt"
          # Se verifica readiness y no /actuator/health porque readiness incluye
          # el indicador db (ver application.properties): el gate del deploy pasa
          # a exigir que el backend pueda hablar con PostgreSQL, no solo que la
          # JVM responda. Si la DB no esta, esto falla y dispara el rollback
          # automatico del paso siguiente en vez de certificar un deploy roto.
          # 12 x 5 s = 60 s: Spring Boot necesita tiempo para arrancar la JVM
          for i in $(seq 1 12); do
            echo "Intento $i/12 - http://127.0.0.1:${{ steps.env.outputs.puerto }}/actuator/health/readiness"
            rm -f "$RESP"
            HTTP=$(curl -o "$RESP" -w "%{http_code}" -sS \
              "http://127.0.0.1:${{ steps.env.outputs.puerto }}/actuator/health/readiness" 2>"$ERR" || true)
            BODY=$(cat "$RESP" 2>/dev/null || true)
            if echo "$BODY" | grep -q '"status":"UP"'; then
              echo "Backend (Spring Boot) respondiendo OK (intento $i). HTTP $HTTP"
              exit 0
            fi
            echo "  HTTP: $HTTP | Body: $BODY"
            cat "$ERR" 2>/dev/null || true
            sleep 5
          done
          echo "El backend no respondió después de 60 s."
          echo "--- Logs del contenedor backend ---"
          docker compose -p "${{ steps.env.outputs.proyecto }}" logs --tail=50 backend || true
          echo "--- Estado de contenedores ---"
          docker compose -p "${{ steps.env.outputs.proyecto }}" ps || true
          exit 1

      - name: Revertir si falló la verificación
        if: steps.salud.outcome == 'failure' && steps.previa.outputs.tag != ''
        env:
          BACKEND_TAG: ${{ steps.previa.outputs.tag }}
          BACKEND_PORT: ${{ steps.env.outputs.puerto }}
        run: |
          set -euo pipefail
          # Verificar que la imagen de rollback todavía existe (la limpieza conserva 5)
          if ! docker image inspect "energiai-backend:${{ steps.previa.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::Imagen de rollback energiai-backend:${{ steps.previa.outputs.tag }} no encontrada. Rollback automático imposible."
            exit 1
          fi
          export BACKEND_TAG="$BACKEND_TAG"
          export BACKEND_PORT="$BACKEND_PORT"
          echo "::warning::Deploy fallido. Restaurando la versión ${{ steps.previa.outputs.tag }}"
          docker compose --env-file "${{ steps.dotenv.outputs.env_file }}" -p "${{ steps.env.outputs.proyecto }}" up -d --no-build --no-deps backend
          echo "Ambiente restaurado."

      - name: Marcar el job como fallido si hubo rollback
        if: steps.salud.outcome == 'failure'
        run: |
          echo "::error::El despliegue no superó la verificación de salud."
          exit 1

      - name: Limpiar imágenes viejas
        if: always()
        run: |
          set -uo pipefail
          EN_USO=$(docker ps -a --format '{{.Image}}' | sort -u)
          docker images 'energiai-backend' --format '{{.Tag}} {{.CreatedAt}}' \
            | grep -v '^local ' \
            | sort -k2 -r \
            | tail -n +6 \
            | awk '{print $1}' \
            | while read -r TAG; do
                IMG="energiai-backend:$TAG"
                if echo "$EN_USO" | grep -qxF "$IMG"; then
                  echo "  conservada (en uso): $IMG"
                else
                  docker rmi "$IMG" >/dev/null 2>&1 && echo "  borrada: $IMG" || true
                fi
              done

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue del Backend (Spring Boot)"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Ambiente | ${{ steps.env.outputs.ambiente }} |"
            echo "| Proyecto compose | ${{ steps.env.outputs.proyecto }} |"
            echo "| Puerto interno | ${{ steps.env.outputs.puerto }} |"
            echo "| Versión desplegada | \`${{ steps.env.outputs.tag }}\` |"
            echo "| Versión anterior | \`${{ steps.previa.outputs.tag || '—' }}\` |"
            echo ""
            echo "Para volver atrás: *Run workflow* con el SHA de la versión anterior."
          } >> "$GITHUB_STEP_SUMMARY"
