$kind: collection
description: |-
  Este test requiere detener el ML service.

  Pasos para reproducir:
  1. Levantar todo el stack con: docker compose up -d
  2. Detener solo el ML service: docker stop ml-service
  3. Ejecutar este request contra el backend.
  4. El backend no puede conectar al ML y retorna 503.
  5. Reiniciar ML service: docker start ml-service
order: 6000
