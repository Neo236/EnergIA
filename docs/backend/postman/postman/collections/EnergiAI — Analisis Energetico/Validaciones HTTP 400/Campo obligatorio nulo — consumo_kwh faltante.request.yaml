$kind: http-request
url: "{{baseUrl}}/api/v1/analisis-energetico"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cantidad_equipos": 8,
      "tipo_inmueble": "Casa",
      "horas_alto_consumo": 6
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => {
          pm.response.to.have.status(400);
      });

      pm.test('Content-Type is JSON', () => {
          pm.response.to.be.json;
      });

      pm.test('Error response has required fields', () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property('timestamp');
          pm.expect(body).to.have.property('status');
          pm.expect(body).to.have.property('error');
          pm.expect(body).to.have.property('mensaje');
      });

      pm.test('Status code in body is 400', () => {
          const body = pm.response.json();
          pm.expect(body.status).to.eql(400);
      });

      pm.test('Error is BAD_REQUEST', () => {
          const body = pm.response.json();
          pm.expect(body.error).to.eql('BAD_REQUEST');
      });

      pm.test(' detalles array exists for validation errors', () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property('detalles');
          pm.expect(body.detalles).to.be.an('array');
          pm.expect(body.detalles.length).to.be.above(0);
      });

      pm.test('Each detail has campo and mensaje', () => {
          const body = pm.response.json();
          body.detalles.forEach((d) => {
              pm.expect(d).to.have.property('campo');
              pm.expect(d).to.have.property('mensaje');
          });
      });
    language: text/javascript
order: 1000
