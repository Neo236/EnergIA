$kind: http-request
url: "{{mlUrl}}/analisis-energetico"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "consumo_kwh": 300,
      "cantidad_equipos": 8,
      "tipo_inmueble": "Casa",
      "horas_alto_consumo": 6,
      "uso_horario_pico": false,
      "zona_fria": false,
      "fuente_calefaccion": "Electricidad",
      "fuente_agua_caliente": "Electricidad",
      "metros_cuadrados": 100,
      "antiguedad_vivienda": 10,
      "calidad_aislamiento": "Media"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is JSON', () => {
          pm.response.to.be.json;
      });

      pm.test('Response has ML fields (no id, no fecha)', () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property('categoria');
          pm.expect(body).to.have.property('probabilidad');
          pm.expect(body).to.have.property('costo_estimado_mensual');
          pm.expect(body).to.have.property('recomendaciones');
          pm.expect(body).to.not.have.property('id');
          pm.expect(body).to.not.have.property('fecha');
      });

      pm.test('categoria is valid', () => {
          const body = pm.response.json();
          pm.expect(['Eficiente', 'Moderado', 'Ineficiente']).to.include(body.categoria);
      });

      pm.test('probabilidad is between 0 and 1', () => {
          const body = pm.response.json();
          pm.expect(body.probabilidad).to.be.at.least(0);
          pm.expect(body.probabilidad).to.be.at.most(1);
      });

      pm.test('costo_estimado_mensual is >= 0', () => {
          const body = pm.response.json();
          pm.expect(body.costo_estimado_mensual).to.be.at.least(0);
      });

      pm.test('recomendaciones is a non-empty array', () => {
          const body = pm.response.json();
          pm.expect(body.recomendaciones).to.be.an('array');
          pm.expect(body.recomendaciones.length).to.be.above(0);
      });
    language: text/javascript
order: 1000
