name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida la propia infraestructura de CI. Es barato (segundos) y atrapa una
  # clase de error que ningun otro job ve: un workflow con sintaxis invalida o
  # una accion mal referenciada no falla, simplemente NO se ejecuta — y un
  # workflow que no corre se parece mucho a uno que pasa.
  lint-ci:
    name: Validar workflows y scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      # Los .sh del repositorio se ejecutan en Linux. shellcheck atrapa las
      # variables sin comillas y los errores de expansion que solo se
      # manifiestan cuando una ruta trae espacios.
      #
      # --severity=warning: falla por warnings y errores, no por avisos de
      # estilo. El disparador concreto es SC2317 ("codigo inalcanzable"), que
      # este repositorio dispara en falso — verify_certification.sh define
      # funciones que shellcheck no ve invocadas porque se llaman desde un
      # despacho. Fallar por eso convertiria el linter en ruido, que es como
      # empiezan a ignorarse.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No hay scripts .sh que revisar."
            exit 0
          fi
          printf '  %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

  backend-ci:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/analisis-energetico-api/pom.xml'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x backend/analisis-energetico-api/mvnw

      - name: Build, Test & Package
        working-directory: backend/analisis-energetico-api
        run: ./mvnw -B verify

  data-science-ci:
    name: Test Data Science Microservice (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'data-science/raw/requirements.txt'

      - name: Install dependencies
        working-directory: data-science/raw
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint Python syntax
        working-directory: data-science/raw
        run: |
          python -m compileall -q domain application infrastructure interfaces

      - name: Validate API schema consistency
        working-directory: data-science/raw
        run: |
          python -c "
          from interfaces.api.schemas import TipoInmueble, CalidadAislamiento, FuenteEnergia
          from infrastructure.data.simulation import TIPO_INMUEBLE, CALIDAD_AISLAMIENTO, FUENTE
          from application.training import CAT_COLS, NUM_COLS
          from application.inference import MODELO_FEATURES
          assert set(TipoInmueble.__args__) == set(TIPO_INMUEBLE), 'tipo_inmueble mismatch'
          assert set(CalidadAislamiento.__args__) == set(CALIDAD_AISLAMIENTO), 'aislamiento mismatch'
          assert set(FuenteEnergia.__args__) == set(FUENTE), 'fuente mismatch'
          assert set(CAT_COLS + NUM_COLS) == set(MODELO_FEATURES), 'feature mismatch'
          print('Schema consistency OK')
          "

      - name: Run pytest
        working-directory: data-science/raw
        run: python -m pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t energia-ml:test -f data-science/Dockerfile data-science

      - name: Smoke test container /health
        # Si el /health no responde despues de 5 intentos, abortamos con
        # exit 1. Sin esto el step pasaba aunque el contenedor estuviera
        # muerto, y el siguiente step (verify_certification.sh) fallaba
        # con un mensaje menos util.
        run: |
          docker run -d --name ml-test -p 8765:8000 energia-ml:test
          sleep 8
          HEALTH_OK=0
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 http://localhost:8765/health; then
              echo "Healthcheck OK (intento $i)"
              HEALTH_OK=1
              break
            fi
            echo "Waiting... attempt $i"
            sleep 3
          done
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "El contenedor no respondio /health despues de 5 intentos"
            docker logs ml-test
            exit 1
          fi

      - name: Certificación end-to-end (verify_certification.sh)
        # Ejecuta checks contra el contenedor arriba:
        #   - /health
        #   - /model-info (path + loaded + size)
        #   - 3 perfiles golden (Eficiente, Moderado, Ineficiente)
        # SKIP_LOCAL_FILES=1 porque el checkout de CI no tiene los .joblib
        # (gitignored). Los checks locales de integridad (CHECKSUMS +
        # MODEL_BINDING) se ejecutan localmente por el dev antes del push.
        # Falla el step si cualquier check de runtime falla.
        run: |
          ML_SERVICE_URL=http://localhost:8765 SKIP_LOCAL_FILES=1 \
            bash data-science/data/verify_certification.sh

      - name: Cleanup test container
        if: always()
        run: |
          docker stop ml-test 2>/dev/null || true
          docker rm ml-test 2>/dev/null || true

  frontend-ci:
    name: Build & Smoke Test Front-End
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Falla ante un error de tipos antes de gastar tiempo en el build de
      # la imagen. Es la red que protege el contrato: si contrato.ts deja de
      # coincidir con cómo lo usan las páginas, se rompe acá.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # El smoke test de más abajo solo prueba que el contenedor sirve HTML:
      # no ve si fechaRelativa interpreta bien la zona horaria, ni si borrar
      # una selección del historial deja los ids correctos. Esto sí.
      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Build Docker image
        run: docker build -t energia-frontend:test ./frontend

      # El build de la imagen solo comprueba que COMPILA. Este paso comprueba
      # que además FUNCIONA servida: un typo en nginx.conf o un fallback de
      # router mal configurado pasan el build y explotarían en el despliegue.
      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name front-test -p 8099:8080 energia-frontend:test
          trap 'docker rm -f front-test >/dev/null 2>&1 || true' EXIT

          LISTO=0
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8099/ -o /dev/null; then
              echo "El contenedor responde (intento $i)."
              LISTO=1
              break
            fi
            echo "Esperando... intento $i"
            sleep 2
          done
          if [ "$LISTO" -ne 1 ]; then
            echo "El contenedor no respondió."
            docker logs front-test
            exit 1
          fi

          echo "Verificando que el HTML referencie el bundle compilado:"
          curl -fsS http://localhost:8099/ | grep -q '/assets/index-.*\.js' \
            && echo "  OK bundle referenciado"

          echo "Verificando el fallback del router en rutas del cliente:"
          for RUTA in /resultado /analisis/123 /una-ruta-inexistente; do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$RUTA")
            [ "$CODIGO" = "200" ] || { echo "  FALLO $RUTA devolvió $CODIGO"; exit 1; }
            echo "  OK $RUTA"
          done

  # Unico job que prueba el sistema ARMADO. Los demas validan cada servicio por
  # separado, y eso deja pasar una clase entera de fallos: los que aparecen en
  # como se conectan las piezas, no dentro de ninguna.
  #
  # Los dos errores reales de la migracion a este servidor son de esa clase, y
  # ambos pasaron el resto del CI sin despeinarse — se descubrieron a mano, en
  # el navegador. Cada assert de aqui abajo esta atado a uno de ellos.
  docker-ci:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env placeholder for compose validation
        # ml-service tiene env_file: .env en docker-compose.yml. CI no necesita
        # secrets reales (no corre storage OCI aca), solo un archivo que exista
        # para que `docker compose config` no falle con "env file not found".
        run: |
          if [ ! -f .env ]; then
            printf "# CI placeholder (no secrets, no production)\nSTORAGE_BACKEND=local\n" > .env
          fi

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Levantar el stack completo
        run: docker compose up -d

      - name: Esperar a que responda
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8088/actuator/health > /dev/null 2>&1; then
              echo "Listo tras ${i}0s aprox."
              exit 0
            fi
            sleep 10
          done
          echo "El stack no respondio en 10 minutos."
          exit 1

      # El modelo entrenado se versiona en data/latest/ justamente para que el
      # servicio lo cargue en vez de reentrenarlo al arrancar. El reentrenamiento
      # es un camino de respaldo valido, asi que no falla ni avisa: produce un
      # modelo equivalente pero no identico, y el despliegue queda sirviendo algo
      # distinto de lo que dice servir. Solo se detecta leyendo los logs.
      - name: El modelo se cargo del repositorio, no se reentreno
        run: |
          set -euo pipefail
          logs=$(docker compose logs ml-service)
          if ! grep -q "Modelo pre-cargado en memoria" <<< "$logs"; then
            echo "No se encontro la carga del modelo en los logs."
            echo "$logs" | tail -40
            exit 1
          fi
          echo "OK: el modelo salio de data/latest/."

      # Los archivos de public/ se piden por ruta fija. Si no llegan a la imagen,
      # nginx responde el index.html del SPA por su try_files: HTTP 200 con
      # content-type text/html donde deberia haber una fuente. El navegador lo
      # rechaza por nosniff y la tipografia cae al respaldo — pero el codigo 200
      # hace que ningun chequeo de disponibilidad note nada.
      - name: Los estaticos se sirven con su tipo real
        run: |
          set -euo pipefail
          fallo=0
          verificar() {
            tipo=$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8088$1")
            if [[ "$tipo" != "$2"* ]]; then
              echo "  $1 -> '$tipo' (se esperaba '$2')"
              fallo=1
            else
              echo "  $1 -> $tipo"
            fi
          }
          verificar /fonts/inter-latin.woff2 font/woff2
          verificar /favicon.svg image/svg+xml
          verificar / text/html
          exit $fallo

      # El caso de referencia: el mismo payload devuelve el mismo resultado que
      # servia el despliegue anterior. Cubre la cadena entera —proxy, backend,
      # servicio de ML, modelo— y ademas fija el comportamiento del modelo: si
      # alguien lo reemplaza por otro, esto lo dice.
      - name: Un analisis extremo a extremo devuelve el resultado conocido
        run: |
          set -euo pipefail
          respuesta=$(curl -fsS --max-time 30 -X POST \
            http://127.0.0.1:8088/api/v1/analisis-energetico \
            -H 'Content-Type: application/json' \
            -d '{"consumo_kwh":420,"cantidad_equipos":10,"tipo_inmueble":"Casa",
                 "uso_horario_pico":false,"horas_alto_consumo":12,"zona_fria":false,
                 "calidad_aislamiento":"Media","fuente_calefaccion":"Electricidad",
                 "fuente_agua_caliente":"Electricidad"}')
          echo "$respuesta"

          for esperado in '"categoria":"Moderado"' '"probabilidad":0.675' '"costo_estimado_mensual":315.0'; do
            grep -q "$esperado" <<< "$respuesta" || { echo "Falta en la respuesta: $esperado"; exit 1; }
          done

          # El analisis tiene que persistir: es lo que hace que su URL sea
          # compartible y sobreviva a una recarga.
          id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' <<< "$respuesta")
          [ -n "$id" ] || { echo "La respuesta no trae id."; exit 1; }
          curl -fsS --max-time 15 "http://127.0.0.1:8088/api/v1/analisis-energetico/$id" \
            | grep -q '"categoria":"Moderado"' \
            || { echo "El analisis $id no se recupera igual."; exit 1; }
          echo "OK: persistido y recuperado ($id)."

      # Swagger y Actuator no cuelgan de /api: los sirve Spring en la raiz. Sin
      # su regla propia en el proxy, el `handle` final los mandaria al frontend
      # y responderian el SPA con codigo 200.
      - name: El proxy rutea la API, Swagger y Actuator
        run: |
          set -euo pipefail
          for ruta in /actuator/health /swagger-ui/index.html /v3/api-docs; do
            codigo=$(curl -fsS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088$ruta")
            echo "  $ruta -> $codigo"
          done

      - name: Logs del stack si algo fallo
        if: failure()
        run: docker compose logs --tail=120

      - name: Bajar el stack
        if: always()
        run: docker compose down -v