name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/analisis-energetico-api/pom.xml'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x backend/analisis-energetico-api/mvnw

      - name: Build, Test & Package
        working-directory: backend/analisis-energetico-api
        run: ./mvnw -B verify

  data-science-ci:
    name: Test Data Science Microservice (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'data-science/raw/requirements.txt'

      - name: Install dependencies
        working-directory: data-science/raw
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint Python syntax
        working-directory: data-science/raw
        run: |
          python -m compileall -q domain application infrastructure interfaces

      - name: Validate API schema consistency
        working-directory: data-science/raw
        run: |
          python -c "
          from interfaces.api.schemas import TipoInmueble, CalidadAislamiento, FuenteEnergia
          from infrastructure.data.simulation import TIPO_INMUEBLE, CALIDAD_AISLAMIENTO, FUENTE
          from application.training import CAT_COLS, NUM_COLS
          from application.inference import MODELO_FEATURES
          assert set(TipoInmueble.__args__) == set(TIPO_INMUEBLE), 'tipo_inmueble mismatch'
          assert set(CalidadAislamiento.__args__) == set(CALIDAD_AISLAMIENTO), 'aislamiento mismatch'
          assert set(FuenteEnergia.__args__) == set(FUENTE), 'fuente mismatch'
          assert set(CAT_COLS + NUM_COLS) == set(MODELO_FEATURES), 'feature mismatch'
          print('Schema consistency OK')
          "

      - name: Run pytest
        working-directory: data-science/raw
        run: python -m pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t energiai-ml:test -f data-science/Dockerfile data-science

      - name: Smoke test container /health
        run: |
          docker run -d --name ml-test -p 8765:8000 energiai-ml:test
          sleep 8
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8765/health; then
              echo "Healthcheck OK"
              break
            fi
            echo "Waiting... attempt $i"
            sleep 3
          done
          docker stop ml-test
          docker rm ml-test

  frontend-ci:
    name: Build & Test Frontend (Nginx Container)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t energiai-frontend:test ./frontend

      - name: Smoke test container serving static content
        run: |
          docker run -d --name front-test -p 3456:80 energiai-frontend:test
          sleep 3
          curl -fsS http://localhost:3456/ || exit 1
          docker stop front-test
          docker rm front-test

  docker-ci:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build