spring.application.name=analisis-energetico-api
server.port=${PORT:8080}

# -------------------------------------------------------------
# Spring Boot Actuator Configuration (Health Check Best Practice)
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

#Configuracion Servicio de Machine Learning
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout=${ML_CONNECT_TIMEOUT:3000}
ml.service.read-timeout=${ML_REAL_TIMEOUT:5000}

# -------------------------------------------------------------
# Base de datos (persistencia de analisis) y Flyway
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/energiai}
spring.datasource.username=${DB_USER:energiai}
spring.datasource.password=${DB_PASSWORD:energiai}

# El esquema lo maneja Flyway (db/migration), Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
