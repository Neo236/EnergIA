version: '3.8'

services:
  # -------------------------------------------------------------
  # Backend Principal - Spring Boot (Java 17)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energiai-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - ML_SERVICE_URL=http://ml-service:8000
      # Variables OCI Object Storage (configurar para producción en OCI)
      # - OCI_STORAGE_NAMESPACE=${OCI_STORAGE_NAMESPACE}
      # - OCI_STORAGE_BUCKET=${OCI_STORAGE_BUCKET}
      # - OCI_STORAGE_REGION=${OCI_STORAGE_REGION}
    # NOTA: Descomentar depends_on cuando el microservicio ml-service esté completo
    # depends_on:
    #   ml-service:
    #     condition: service_started
    restart: unless-stopped
    networks:
      - energiai-network

  # -------------------------------------------------------------
  # Microservicio Data Science / ML - FastAPI (Python 3.10)
  # NOTA: Comentado temporalmente hasta que el módulo data-science esté completo (faltan requirements.txt y src/api/main.py).
  # Descomentar una vez que el equipo de Data Science agregue dichos archivos.
  # -------------------------------------------------------------
  # ml-service:
  #   build:
  #     context: ./data-science
  #     dockerfile: Dockerfile
  #   container_name: energiai-ml-service
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - PORT=8000
  #     - ENVIRONMENT=production
  #   restart: unless-stopped
  #   networks:
  #     - energiai-network

networks:
  energiai-network:
    driver: bridge
