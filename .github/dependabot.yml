version: 2

# Dependabot abre un PR cuando una dependencia queda vieja o le sale un aviso
# de seguridad. Importa mas en un proyecto como este que en uno de trabajo
# diario: el repositorio puede quedar meses sin que nadie lo toque, pero las
# dependencias envejecen igual. Sin esto, la unica forma de enterarse es que
# alguien se acuerde de mirar.
#
# Los cinco ecosistemas del proyecto estan cubiertos. Las actualizaciones
# entran por Pull Request y el CI las valida antes de que nadie las mire:
# el test extremo a extremo levanta el stack completo, asi que una version
# que rompa la integracion se ve sin tener que revisar el diff.
#
# Cada ecosistema agrupa sus actualizaciones MENORES Y DE PARCHE en un solo PR
# semanal. Con cinco ecosistemas, abrir un PR por dependencia produce una
# cantidad de ruido que termina en que se ignoren todos — el modo habitual en
# que Dependabot deja de servir.
#
# Los saltos de version MAYOR quedan deliberadamente fuera de los grupos, y
# Dependabot los abre de a uno. La primera tanda mostro por que: la que
# agrupaba todo junto traia cinco mayores del frontend en un mismo PR
# (TypeScript 5→7, Vite 7→8, Vitest 3→4, jsdom 26→30, plugin-react 5→6) y
# quedaba inmergeable entera porque UNO de esos cinco —TypeScript 7— entra en
# conflicto con la peer dependency de typescript-eslint. Los otros cuatro no
# tenian nada de malo, pero venian atados al que si.
#
# Un mayor casi nunca es "actualizar y ver": hay que leer sus notas de version.
# Agruparlo con parches convierte cada tanda en todo-o-nada.

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /data-science/raw
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      ml:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: maven
    directory: /backend/analisis-energetico-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Las acciones se pinean por version mayor (@v4). Sin esto, una accion
  # abandonada se queda ahi para siempre sin que nada lo señale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      acciones:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Las imagenes base son la superficie de ataque que menos se mira: postgres,
  # caddy, node, python y nginx se actualizan solas dentro de su tag menor,
  # pero un salto de version mayor solo aparece si algo lo avisa.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /data-science
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # La imagen de Python queda fijada a parches. El motivo es un desajuste de
    # vocabulario: para Docker —y por lo tanto para Dependabot— la etiqueta
    # `3.10` -> `3.14` es un salto MENOR, pero para Python es un cambio de
    # version del lenguaje.
    #
    # requirements.txt se genera con `pip-compile --python-version 3.10` y esos
    # pines no tienen wheels precompilados en versiones mas nuevas: pip pasa a
    # compilar numpy, pandas y scikit-learn desde codigo fuente y la build se
    # va de diez minutos a mas de quince, hasta agotar el tiempo del job.
    #
    # Subir Python es deseable, pero exige regenerar requirements.txt para la
    # version nueva y comprobar que el modelo entrenado siga cargando con el
    # scikit-learn correspondiente. Es un trabajo con alcance propio, no un
    # bump de dependencias.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      imagenes:
        patterns: ["*"]
        update-types: ["minor", "patch"]
