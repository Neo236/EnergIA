$kind: http-request
url: "{{baseUrl}}/api/v1/analisis-energetico"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "consumo_kwh": 300,
      "cantidad_equipos": 8,
      "tipo_inmueble": "Departamento",
      "uso_horario_pico": true,
      "horas_alto_consumo": 3,
      "metros_cuadrados": 35,
      "antiguedad_vivienda": 7,
      "zona_fria": false,
      "calidad_aislamiento": "Media",
      "fuente_calefaccion": "Electricidad",
      "fuente_agua_caliente": "Electricidad"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is JSON', () => {
          pm.response.to.be.json;
      });

      pm.test('Response has required fields', () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property('id');
          pm.expect(body).to.have.property('fecha');
          pm.expect(body).to.have.property('categoria');
          pm.expect(body).to.have.property('probabilidad');
          pm.expect(body).to.have.property('costo_estimado_mensual');
          pm.expect(body).to.have.property('recomendaciones');
      });

      pm.test('id is a valid UUID', () => {
          const body = pm.response.json();
          const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          pm.expect(body.id).to.match(uuidRegex);
      });

      pm.test('categoria is a valid enum value', () => {
          const body = pm.response.json();
          pm.expect(['Eficiente', 'Moderado', 'Ineficiente']).to.include(body.categoria);
      });

      pm.test('probabilidad is between 0 and 1', () => {
          const body = pm.response.json();
          pm.expect(body.probabilidad).to.be.at.least(0);
          pm.expect(body.probabilidad).to.be.at.most(1);
      });

      pm.test('costo_estimado_mensual is >= 0', () => {
          const body = pm.response.json();
          pm.expect(body.costo_estimado_mensual).to.be.at.least(0);
      });

      pm.test('recomendaciones is a non-empty array', () => {
          const body = pm.response.json();
          pm.expect(body.recomendaciones).to.be.an('array');
          pm.expect(body.recomendaciones.length).to.be.above(0);
      });

      pm.test('fecha is a valid datetime string', () => {
          const body = pm.response.json();
          pm.expect(body.fecha).to.be.a('string');
          pm.expect(new Date(body.fecha).toISOString()).to.equal(body.fecha);
      });


      pm.test('categoria is Moderado for this profile', () => {
          const body = pm.response.json();
          pm.expect(body.categoria).to.eql('Moderado');
      });
    language: text/javascript
order: 2000
