spring.application.name=analisis-energetico-api
server.port=${PORT:8080}

# -------------------------------------------------------------
# Spring Boot Actuator Configuration (Health & Readiness Probes)
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true

#Configuracion Servicio de Machine Learning
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout=${ML_CONNECT_TIMEOUT:3000}
ml.service.read-timeout=${ML_REAL_TIMEOUT:5000}

# Token compartido para distinguir las verificaciones automaticas de CI/CD
# (cabecera X-EnergiAI-Sonda, ver com.energiai.security.VerificadorSonda) de
# un analisis real, y no persistirlas. Vacio por defecto: sin este valor
# configurado, ninguna peticion se trata como sonda.
sonda.token=${TOKEN_SONDA_SALUD:}

# -------------------------------------------------------------
# Base de datos (persistencia de analisis) y Flyway
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/energiai}
spring.datasource.username=${DB_USER:energiai}
spring.datasource.password=${DB_PASSWORD:energiai}

# El esquema lo maneja Flyway (db/migration), Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Open Session In View queda desactivado a proposito: mantiene la conexion a
# la DB abierta durante toda la request (incluida la serializacion de la
# respuesta) en vez de solo durante la transaccion, lo que agota el pool de
# conexiones antes bajo carga y esconde accesos a datos "lazy" fuera de una
# transaccion real. AnalisisEnergeticoService ya usa @Transactional donde
# hace falta, asi que desactivarlo no rompe nada.
spring.jpa.open-in-view=false
